name: Verify template
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_smoke:
        description: Run the official CrazyGames CDN local smoke test
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: E2E_PREVIEW=1 npm run test:e2e
      - run: npm run test:e2e:standalone
      - run: npm run test:sdk
        if: github.event_name == 'workflow_dispatch' && inputs.sdk_smoke
      - uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'workflow_dispatch' && inputs.sdk_smoke
        with:
          name: crazygames-sdk-observation
          path: test-results/sdk/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
